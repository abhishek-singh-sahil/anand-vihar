<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <!-- Outer circle plate -->
  <circle cx="24" cy="24" r="22" fill="#013e37" />
  <circle cx="24" cy="24" r="20" stroke="#ff9248" stroke-width="1.8" stroke-dasharray="3 2" />
  <circle cx="24" cy="24" r="17" fill="#ffffff" />
  
  <!-- Sweets on the plate -->
  <!-- Sweet 1: Ladoo (Golden-Orange round sweet) -->
  <circle cx="20" cy="27" r="8" fill="#ff9248" />
  <!-- Garnish/pistachio pieces on Ladoo -->
  <circle cx="17" cy="24" r="0.8" fill="#fff4eb" />
  <circle cx="22" cy="25" r="0.8" fill="#fff4eb" />
  <circle cx="20" cy="29" r="0.8" fill="#fff4eb" />
  <circle cx="18" cy="28" r="1.2" fill="#ffb300" />
  <circle cx="23" cy="28" r="1" fill="#ffb300" />
  <circle cx="17" cy="26" r="1" fill="#22c55e" />
  
  <!-- Sweet 2: Kaju Katli / Diamond Sweet (overlapping the Ladoo) -->
  <path d="M29 15 L37 23 L29 31 L21 23 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" />
  <!-- Silver foil (varq) details -->
  <path d="M25 21 L28 18 L30 22 L27 24 Z" fill="#ffffff" opacity="0.85" />
  <path d="M30 26 L33 23 L34 25 L31 27 Z" fill="#ffffff" opacity="0.85" />
